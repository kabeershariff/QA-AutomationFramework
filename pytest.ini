[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .
addopts = -ra -q --strict-markers --screenshot=only-on-failure --tracing=retain-on-failure --video=retain-on-failure --output=reports/artifacts --basetemp=.pytest_tmp
timeout = 60
markers =
    smoke: smoke tests
    regression: regression tests
    negative: negative tests
    boundary: boundary case tests
    cross_browser: cross-browser tests
    error_handling: error-handling tests